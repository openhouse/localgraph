[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localgraph"
version = "0.1.0"
description = "Local-first correspondence graph for private source texts and filesystem-native views"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jamie Burkart" }]
dependencies = []

[project.scripts]
localgraph = "localgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localgraph = ["*.applescript"]
